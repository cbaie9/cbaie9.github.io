<body>
    <div class="quiz-container">
        <h1>Quiz</h1>
        <div class="question" id="question">Quelle est la capitale de la France ? ( Oui la question est éclaté au sol et ?) </div>
        <ul class="answers" id="answers">
            <li><button onclick="checkAnswer(this)" data-correct="false">Berlin</button></li>
            <li><button onclick="checkAnswer(this)" data-correct="false">Madrid</button></li>
            <li><button onclick="checkAnswer(this)" data-correct="true">Paris</button></li>
            <li><button onclick="checkAnswer(this)" data-correct="false">Rome</button></li>
        </ul>
        <div class="result" id="result"></div>
	<p id="rr4">C'est beau ptn</p>
    </div>

    <script>
        function checkAnswer(button) {
            const isCorrect = button.getAttribute('data-correct') === 'true';
            const result = document.getElementById('result');
	    const rr4 = document.getElementById('rr4');
            if (isCorrect) {
                result.textContent = 'Bonne réponse !';
                result.style.color = 'green';
		rr4.style.color = 'blue';
            } else {
                result.textContent = 'Mauvaise réponse. Réessayez !';
                result.style.color = 'red';
            }
        }
    </script>
