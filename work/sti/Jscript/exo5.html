<head>

  <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
  <script type="text/javascript">
  // <!--
var a=3;
var b=2;
var x=0;
var tab = new Array("-2","1","4");

    function multiplie(x){
      return(x+2);
}
    function afficher(){
      alert(multiplie(parseInt(tab[0])));
      alert(multiplie(parseInt(tab[tab.length-1])));
    }
  // -->
  </script>
</head>
<body>

<h1>Écriture d'une fonction simple</h1>

<p>Cliquez sur le bouton pour lancer la fonction&nbsp;: <button onclick="afficher()">Lancer la fonction</button></p>
