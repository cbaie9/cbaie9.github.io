<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>

<head>
  <title>Écriture d'une fonction simple</title>
  <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">
  <script type="text/javascript">
  // <!--
var a=3;
var b=2;
var x=0;

    function multiplie(x=8){
      return(x*3);
}
    function afficher(){
      alert(multiplie(a))
      alert(multiplie(b))
      alert(multiplie())
    }
  // -->
  </script>
</head>
<body>

<h1>Écriture d'une fonction simple</h1>

<p>Cliquez sur le bouton pour lancer la fonction&nbsp;: <button onclick="afficher()">Lancer la fonction</button></p>

</body>
</html>
